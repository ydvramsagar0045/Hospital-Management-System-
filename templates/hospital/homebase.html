<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hospital Management</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

    <style>
      body {
        background-color: #f8fafc;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: #334155;
      }

      /* --- TOP NAVIGATION BAR --- */
      .navbar {
        background: #ffffff !important;
        border-bottom: 1px solid #e2e8f0;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        padding: 14px 28px;
      }

      .navbar-brand {
        font-weight: 800;
        letter-spacing: 0.5px;
        font-size: 1.25rem;
        color: #0284c7 !important;
      }

      .nav-link {
        font-weight: 600;
        color: #475569 !important;
        margin: 0 4px;
        padding: 8px 16px !important;
        border-radius: 8px;
        transition: all 0.2s ease;
      }

      .nav-link:hover {
        background: #f1f5f9;
        color: #0284c7 !important;
      }

      .nav-link i {
        margin-right: 6px;
      }

      /* Special highlight for login roles */
      .nav-link.active-role {
        background: #e0f2fe;
        color: #0284c7 !important;
      }

      /* --- FOOTER --- */
      footer {
        background: #ffffff;
        border-top: 1px solid #e2e8f0;
        color: #64748b;
        padding: 24px 0 16px 0;
        text-align: center;
      }

      .social-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        color: #64748b !important;
        margin: 0 5px 12px 5px;
        font-size: 1.1rem;
        transition: all 0.2s ease;
        background: #f1f5f9;
      }

      .social-btn:hover {
        transform: translateY(-3px);
        color: #ffffff !important;
      }

      .btn-fb:hover {
        background: #3b5998 !important;
      }
      .btn-wa:hover {
        background: #25d366 !important;
      }
      .btn-insta:hover {
        background: #e1306c !important;
      }
      .btn-tw:hover {
        background: #1da1f2 !important;
      }
      .btn-li:hover {
        background: #0a66c2 !important;
        color: #ffffff !important;
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
      <div class="container">
        <a href="/" class="navbar-brand">
          <i class="fa fa-hospital-o mr-2"></i>Hospital Management
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-toggle="collapse"
          data-target="#navbarHome"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-between"
          id="navbarHome"
        >
          <ul class="navbar-nav mr-auto">
            <li class="nav-item">
              <a class="nav-link" href="/adminclick"
                ><i class="fa fa-user-secret"></i>Admin</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/doctorclick"
                ><i class="fa fa-user-md"></i>Doctor</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/patientclick"
                ><i class="fa fa-wheelchair"></i>Patient</a
              >
            </li>
          </ul>

          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="/aboutus"
                ><i class="fa fa-info-circle"></i>About Us</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/contactus"
                ><i class="fa fa-envelope"></i>Contact Us</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- PAGE BODY -->
    <div style="margin-top: 72px">
      {% block content %} {% endblock content %}
    </div>



    <!-- FOOTER -->

    <footer>
      <div class="container">
        <div>
          <!-- WhatsApp -->
          <a
            href="https://wa.me/+9163953862155"
            target="_blank"
            class="social-btn btn-wa"
            title="WhatsApp"
          >
            <i class="fa fa-whatsapp"></i>
          </a>

          <!-- LinkedIn -->
          <a href="https://www.linkedin.com/in/ramsagar-yadav-1210a8304" 
          target="_blank" class="social-btn btn-li" title="LinkedIn">
          <i class="fa fa-linkedin"></i>
          </a>

          <!-- Instagram -->
          <a
            href="https://instagram.com/ydvramsagar45"
            target="_blank"
            class="social-btn btn-insta"
            title="Instagram"
          >
            <i class="fa fa-instagram"></i>
          </a>

          <!-- X / Twitter -->
          <a
            href=https://x.com/Ramsagarydv45 { 
          background: #0a66c2 !important; 
           color: #ffffff !important; 
          }
            target="_blank"
            class="social-btn btn-tw"
            title="Twitter"
          >
            <i class="fa fa-twitter"></i>
          </a>
        </div>

        <p
          style="
            margin: 0;
            font-size: 0.88rem;
            color: #94a3b8;
            font-weight: 500;
          "
        >
          Developed with ❤️ By
          <span style="color: #0284c7; font-weight: 700">Ramsagar Yadav</span>
        </p>
      </div>
    </footer>
  </body>
</html>
