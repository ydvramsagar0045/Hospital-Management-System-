{% load static %}
<!doctype html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <style>
      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 30px;
        padding: 30px 20px;
        max-width: 1200px;
        margin: auto;
      }

      .card {
        background: #ffffff;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        text-align: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        transition: all 0.4s ease;
        border: 1px solid rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 20px 35px rgba(0, 123, 255, 0.2);
      }

      /* Image Wrapper - Perfect Fit Settings */
      .img-box {
        width: 100%;
        height: 230px;
        background-color: #f0f4f8; /* Soft background */
        padding: 15px; /* Border se space ke liye */
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain; /* Isse image bilkul nahi kategi */
        transition: transform 0.4s ease;
      }

      .card:hover img {
        transform: scale(1.08); /* Hover par subtle zoom effect */
      }

      .card-body {
        padding: 20px;
      }

      .title {
        color: #2c3e50;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 1.5px;
        margin-bottom: 15px;
        text-transform: uppercase;
      }

      .card-btn {
        border: none;
        outline: 0;
        display: block;
        padding: 12px 20px;
        color: white;
        background: linear-gradient(45deg, #00d2ff, #007bff);
        text-align: center;
        cursor: pointer;
        width: 100%;
        font-size: 15px;
        font-weight: 600;
        border-radius: 12px;
        text-decoration: none;
        box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        transition: all 0.3s ease;
        box-sizing: border-box;
      }

      .card-btn:hover {
        background: linear-gradient(45deg, #007bff, #0056b3);
        box-shadow: 0 6px 20px rgba(0, 123, 255, 0.5);
        color: white !important;
      }

      a:link,
      a:visited {
        text-decoration: none;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="grid-container">
      <!-- ADMIN CARD -->
      <div class="grid-item">
        <div class="card">
          <div class="img-box">
            <img src="{% static 'images/admin.png' %}" alt="Admin" />
          </div>
          <div class="card-body">
            <p class="title">ADMIN</p>
            <a href="/adminclick" class="card-btn">View Dashboard</a>
          </div>
        </div>
      </div>

      <!-- DOCTOR CARD -->
      <div class="grid-item">
        <div class="card">
          <div class="img-box">
            <img src="{% static 'images/doctor.png' %}" alt="Doctor" />
          </div>
          <div class="card-body">
            <p class="title">DOCTOR</p>
            <a href="/doctorclick" class="card-btn">View Dashboard</a>
          </div>
        </div>
      </div>

      <!-- PATIENT CARD -->
      <div class="grid-item">
        <div class="card">
          <div class="img-box">
            <img src="{% static 'images/patient.jpg' %}" alt="Patient" />
          </div>
          <div class="card-body">
            <p class="title">PATIENT</p>
            <a href="/patientclick" class="card-btn">View Dashboard</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
