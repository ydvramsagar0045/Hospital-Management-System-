{% extends 'hospital/homebase.html' %} {% load static %} {% block content %}

<head>
  <title>Hospital Management System</title>
  <style media="screen">
    .hero-section {
      margin: 0;
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
      background:
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.55)),
        url('{% static "images/bg.jpg" %}');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      color: #ffffff;
      text-align: center;
    }

    .hero-title {
      font-size: 3.5rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0px 4px 20px rgba(0, 0, 0, 0.7);
      margin-bottom: 30px;
      letter-spacing: 0.5px;
    }

    .emergency-box {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 30px 50px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .emergency-box:hover {
      transform: translateY(-5px);
    }

    .emergency-box h3 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ff4b5c;
      text-shadow: 0 2px 10px rgba(255, 75, 92, 0.3);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-appointment {
      background: linear-gradient(45deg, #00d2ff, #007bff);
      border: none;
      color: #ffffff;
      padding: 15px 40px;
      font-size: 1.25rem;
      font-weight: 700;
      border-radius: 50px;
      box-shadow: 0 5px 20px rgba(0, 210, 255, 0.4);
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-appointment:hover {
      background: linear-gradient(45deg, #007bff, #0056b3);
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(0, 123, 255, 0.6);
      color: #ffffff;
      text-decoration: none;
    }

    .cards-wrapper {
      padding: 50px 0;
      background-color: #f8f9fa;
    }

    .developer-footer {
      text-align: center;
      padding: 20px 0;
      background-color: #1a1d20;
      color: #b0b7c0;
      font-size: 1rem;
      border-top: 1px solid #2d3238;
    }

    .developer-footer strong {
      color: #00d2ff;
    }
  </style>
</head>

<div class="hero-section">
  <h1 class="hero-title">You’ll Love the Way We Care for You</h1>

  <div class="emergency-box">
    <h3>Need Emergency Care?</h3>
    <div>
      <a class="btn-appointment" href="/patientclick" role="button"
        >Take Appointment</a
      >
    </div>
  </div>
</div>

<div class="cards-wrapper">
  {% include "hospital/admin_doctor_patient_card.html" %}
</div>

{% endblock content %}
